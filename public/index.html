<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boardgame Kartu — Prototipe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="joinScreen" class="join-screen">
    <div class="join-box">
      <h1>Boardgame Kartu</h1>
      <p class="sub">Sesi untuk 4 pemain. Masuk dengan nama kamu.</p>
      <input id="nameInput" type="text" placeholder="Nama pemain" maxlength="20">
      <button id="joinBtn">Gabung Sesi</button>
      <p id="joinError" class="error"></p>
    </div>
  </div>

  <div id="gameScreen" class="game-screen hidden">

    <header class="topbar">
      <h1>Meja Permainan</h1>
      <div id="turnBanner" class="turn-banner">Menunggu pemain...</div>
    </header>

    <section class="public-table">
      <h2>Wilayah 1 — Meja Kartu (Publik)</h2>
      <div class="public-row">
        <div class="deck-block">
          <div class="deck-visual" id="deckVisual">🂠</div>
          <div class="deck-count" id="deckCount">52 kartu</div>
          <div class="actions">
            <button id="shuffleBtn" disabled>Kocok Kartu</button>
            <button id="drawBtn" disabled>Ambil Kartu</button>
          </div>
        </div>
        <div class="players-strip" id="playersStrip"></div>
      </div>
    </section>

    <section class="private-table">
      <h2>Wilayah 2 — Meja Pribadi Saya</h2>

      <div class="zone" id="arrangingZone">
        <div class="zone-label">Area Merangkai Kartu</div>
        <div class="cards-row" id="arrangingCards"></div>
      </div>

      <div class="zone" id="storageZone">
        <div class="zone-label">Area Penyimpanan Kartu</div>
        <div class="cards-row" id="storageCards"></div>
      </div>

      <div class="private-actions">
        <button id="revealBtn" disabled>Tunjukkan ke Publik</button>
        <button id="endTurnBtn" disabled>Selesai Giliran</button>
      </div>
      <p id="actionError" class="error"></p>
    </section>

  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
